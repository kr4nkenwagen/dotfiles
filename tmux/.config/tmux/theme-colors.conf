# Pane and status backgrounds stay "default" so the terminal's own background
# (and its background-opacity) shows through. Omarchy's theme-set-tmux sets an
# explicit bg on window-style, which would make every cell opaque; this file is
# sourced after it by the theme-set hook and wins.
set -g window-style "fg=#a9b1d6,bg=default"
set -g window-active-style "fg=#a9b1d6,bg=default"
set -g status-style "bg=default,fg=#a9b1d6"
set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#94e2d5"
set -g window-status-format "#[fg=#a9b1d6,bg=#585b70] #I #[fg=#a9b1d6,bg=default] #W "
set -g window-status-current-format "#[fg=#181825,bg=#89b4fa] #I #[fg=#89b4fa,bg=default] #W "
set -g message-style "bg=#181825,fg=#94e2d5"
set -g popup-style "bg=#1a1b26,fg=#a9b1d6"
set -g popup-border-style "fg=#94e2d5"
set -g status-right "#[fg=#94e2d5] %H:%M "
