# Tokyo Night (night). On Omarchy this file is regenerated by hooks/tmux-theme-sync on theme switch.

set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7dcfff"
set -g window-status-format "#[fg=#c0caf5,bg=#414868] #I #[fg=#c0caf5,bg=#1a1b26] #W "
set -g window-status-current-format "#[fg=#15161e,bg=#7aa2f7] #I #[fg=#7aa2f7,bg=#1a1b26] #W "
set -g message-style "bg=#15161e,fg=#7dcfff"
set -g popup-style "bg=#1a1b26,fg=#c0caf5"
set -g popup-border-style "fg=#7dcfff"
set -g status-right "#[fg=#7dcfff] %H:%M "
