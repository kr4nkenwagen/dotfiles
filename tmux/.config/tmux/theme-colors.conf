# Generated by theme-sync-tmux from theme: tokyo-night (/home/kr4nk/.local/state/omarchy/current/theme/colors.toml)
# Colours only: the status-bar layout in tmux.conf reads the @thm_* variables.

set -g @thm_bg "#1a1b26"
set -g @thm_fg "#a9b1d6"
set -g @thm_dark_fg "#565f89"
set -g @thm_accent "#7aa2f7"
set -g @thm_selection "#292e42"
set -g @thm_muted "#414868"
set -g @thm_red "#f7768e"
set -g @thm_yellow "#e0af68"
set -g @thm_green "#9ece6a"
set -g @thm_cyan "#449dab"

# Pane and status backgrounds stay "default" so the terminal's own background
# (and its background-opacity) shows through. Omarchy's theme-set-tmux sets an
# explicit bg on window-style, which would make every cell opaque; this file is
# sourced after it by the theme-set hook and wins.
set -g window-style "fg=#a9b1d6,bg=default"
set -g window-active-style "fg=#a9b1d6,bg=default"
set -g status-style "bg=default,fg=#a9b1d6"
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#292e42,fg=#a9b1d6"
set -g message-command-style "bg=#292e42,fg=#7aa2f7"
set -g mode-style "bg=#292e42,fg=#a9b1d6"
set -g popup-style "bg=#1a1b26,fg=#a9b1d6"
set -g popup-border-style "fg=#7aa2f7"
set -g clock-mode-colour "#7aa2f7"
set -g window-status-activity-style "fg=#e0af68"
set -g window-status-bell-style "fg=#f7768e,bold"
