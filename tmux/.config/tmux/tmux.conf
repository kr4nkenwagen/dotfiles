set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "jaclu/tmux-menus"
set -g @plugin "omerxx/tmux-sessionx"
set -g @plugin 'MackenzieStanger/tmux-popup'
set -g @plugin 'Peter-McKinney/tmux-open-file-nvim'
set -g @plugin 'AngryMorrocoy/tmux-neolazygit'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'sainnhe/tmux-fzf'

run '~/.config/tmux/plugins/tpm/tpm'

set -sg terminal-overrides ",*:RGB"
set -g escape-time 0
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1

# ---------- Look ----------
# Layout lives here; colours are the @thm_* variables that theme-sync-tmux writes to
# theme-colors.conf from the current theme, so a theme switch recolours the bar
# without touching this file. Window names (icon + program) come from
# tmux-nerd-font-window-name's automatic-rename-format.
set -g pane-border-lines single
set -g pane-border-indicators colour
set -g popup-border-lines rounded
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 120
set -g window-status-separator " "

# Session pill: accent, turns yellow while the prefix is active.
set -g status-left "#[fg=#{?client_prefix,#{@thm_yellow},#{@thm_accent}}]#[fg=#{@thm_bg},bg=#{?client_prefix,#{@thm_yellow},#{@thm_accent}},bold] #S #[fg=#{?client_prefix,#{@thm_yellow},#{@thm_accent}},bg=default]#[default] "
# Windows: inactive = dim text; current = pill on the theme's selection colour.
set -g window-status-format "#[fg=#{@thm_dark_fg}] #I #W#{?window_zoomed_flag, 󰊓,} "
set -g window-status-current-format "#[fg=#{@thm_selection}]#[fg=#{@thm_accent},bg=#{@thm_selection},bold]#I #W#{?window_zoomed_flag, 󰊓,}#[fg=#{@thm_selection},bg=default]"
# Right: host only over SSH, path with ~ for home, clock in a pill.
set -g status-right "#[fg=#{@thm_dark_fg}]#(test -n \"$SSH_CONNECTION\" && printf '󰒍 #h  ')#[fg=#{@thm_fg}]󰉋 #{s|^/home/[^/]*|~|:pane_current_path}  #[fg=#{@thm_selection}]#[fg=#{@thm_fg},bg=#{@thm_selection}]󰥔 %H:%M #[fg=#{@thm_selection},bg=default]"

set-window-option -g mode-keys vi
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R
bind -r - resize-pane -L 15
bind -r _ resize-pane -D 15
bind -r + resize-pane -U 15
bind -r = resize-pane -R 15
bind Space last-window

# Theme colours, written by theme-sync-tmux on every theme switch. Sourced after the
# plugins so nothing overrides it.
if-shell "[ -f ~/.config/tmux/theme-colors.conf ]" \
  "source-file ~/.config/tmux/theme-colors.conf"

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"

bind-key S display-popup -E -w 100% -h 100% "sh -c '~/.config/tmux/session_selector.sh'"
set -g @continuum-restore 'on'
