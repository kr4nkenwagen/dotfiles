general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/repos/dotfiles/nord-balloons.png
    blur_passes = 2
    color = rgb(1a1b26)
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = Terminess Nerd Font Mono
    color = rgb(c0caf5)
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center
    outline_thickness = 2
    outer_color = rgb(7aa2f7)
    inner_color = rgb(1a1b26)
    font_color = rgb(c0caf5)
    fade_on_empty = false
    placeholder_text = <i>Password</i>
}
