# Standalone Hyprland config for Ubuntu (no Omarchy), Tokyo Night. Needs Ubuntu 26.04+ (Hyprland 0.53+).
# monitors/input/looknfeel/hyprsunset are symlinks into ../hypr so they stay shared with the Omarchy setup.

$terminal = ghostty
$browser = firefox
$launcher = fuzzel

# Autostart
exec-once = waybar
exec-once = mako
exec-once = swaybg -m fill -i ~/repos/dotfiles/nord-balloons.png
exec-once = hypridle
exec-once = hyprsunset
exec-once = systemctl --user start hyprpolkitagent
exec-once = nm-applet
exec-once = blueman-applet
exec-once = swayosd-server
exec-once = clipse -listen
exec = ~/scripts/windowrule.sh

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(7aa2f7)
    col.inactive_border = rgb(414868)
    layout = dwindle
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# Personal settings shared with the Omarchy config
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/looknfeel.conf

# Applications
bindd = SUPER, RETURN, Terminal, exec, $terminal
bindd = SUPER ALT, RETURN, Any terminal (fallback if ghostty is missing), exec, xdg-terminal-exec
bindd = SUPER, SPACE, Launcher, exec, $launcher
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT, N, Editor, exec, $terminal -e nvim
bindd = SUPER SHIFT, T, Activity, exec, xdg-terminal-exec --app-id=TUI.float -e btop
bindd = SUPER SHIFT, E, Files, exec, xdg-terminal-exec --app-id=TUI.float -e ranger
bindd = SUPER SHIFT, V, Clipboard, exec, xdg-terminal-exec --app-id=TUI.float -e clipse
bindd = SUPER SHIFT, C, Chronos, exec, xdg-terminal-exec --app-id=TUI.float -e chronos
bindd = SUPER SHIFT, G, Lazygit, exec, xdg-terminal-exec --app-id=TUI.float -e sh -c 'cd "$(~/scripts/get_last_tmux_pwd.sh)" && exec lazygit'
bindd = SUPER SHIFT, F, Audio, exec, pavucontrol

# Windows
bindd = SUPER, X, Close window, killactive
bindd = SUPER, F, Fullscreen, fullscreen, 0
bindd = SUPER, T, Toggle floating, togglefloating

bindd = SUPER, H, Focus left, movefocus, l
bindd = SUPER, J, Focus down, movefocus, d
bindd = SUPER, K, Focus up, movefocus, u
bindd = SUPER, L, Focus right, movefocus, r
bindd = SUPER, left, Focus left, movefocus, l
bindd = SUPER, down, Focus down, movefocus, d
bindd = SUPER, up, Focus up, movefocus, u
bindd = SUPER, right, Focus right, movefocus, r

bindd = SUPER SHIFT, H, Swap left, swapwindow, l
bindd = SUPER SHIFT, J, Swap down, swapwindow, d
bindd = SUPER SHIFT, K, Swap up, swapwindow, u
bindd = SUPER SHIFT, L, Swap right, swapwindow, r

binded = SUPER, minus, Shrink window, resizeactive, -100 0
binded = SUPER, equal, Grow window, resizeactive, 100 0
binded = SUPER SHIFT, minus, Shrink window vertically, resizeactive, 0 -100
binded = SUPER SHIFT, equal, Grow window vertically, resizeactive, 0 100

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10
bind = SUPER, TAB, workspace, e+1
bind = SUPER SHIFT, TAB, workspace, e-1
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1
bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER SHIFT, S, movetoworkspace, special:magic

# Session
bindd = SUPER, ESCAPE, Lock screen, exec, hyprlock
bindd = SUPER SHIFT, ESCAPE, Exit Hyprland, exit
bindd = SUPER CTRL, R, Reload config, exec, hyprctl reload

# Screenshots (copied to clipboard)
bindd = , PRINT, Screenshot region, exec, grim -g "$(slurp)" - | wl-copy
bindd = SHIFT, PRINT, Screenshot screen, exec, grim - | wl-copy

# Media and brightness
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Window rules
windowrule {
    name = tui-float
    match:class = ^(TUI\.float)$
    float = on
    center = on
}

windowrule {
    name = pavucontrol
    match:class = ^(org\.pulseaudio\.pavucontrol)$
    float = on
    center = on
}
